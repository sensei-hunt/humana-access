<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Humana Access Spending Account</title>
<meta name="description" content="Register for your Humana Access spending account. Set up your access and start managing your HSA, HRA, and FSA benefits online.">
<meta name="keywords" content="Humana Access register, spending account registration, HSA registration, FSA enrollment">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<link rel="canonical" href="https://humanabeta-wealthcareportal.com/register">
<meta property="og:title" content="Register | Humana Access Spending Account">
<meta property="og:description" content="Create your spending account access and start managing your benefits.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://humanabeta-wealthcareportal.com/register">
<meta property="og:image" content="https://humanabeta-wealthcareportal.com/assets/debit-card.png">
<meta property="og:site_name" content="Humana Access">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Register | Humana Access">
<meta name="twitter:description" content="Set up your access and enroll in spending account programs.">
<meta name="twitter:image" content="https://humanabeta-wealthcareportal.com/assets/debit-card.png">
<link rel="icon" type="image/png" href="/assets/debit-card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <a class="brand-text" href="index.html">Humana Access</a>

  <span class="page-title">Registration</span>

  <div class="header-actions">
    <a class="btn-auth signin" href="login.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
      <span>Sign in</span>
    </a>
  </div>
</header>

<main>
  <div class="reg-wrap">
    <div class="steps">
      <div class="step active">STEP 1</div>
      <div class="step">STEP 2</div>
      <div class="step">STEP 3</div>
      <div class="step">STEP 4</div>
      <div class="step">STEP 5</div>
    </div>

    <p class="reg-sub">You are on step 1 of 5</p>
    <p class="reg-lead">Let's get you registered - please provide the information below.</p>

    <form class="reg-form" action="#" method="post" novalidate>
      <div class="reg-row">
        <label for="firstName">First Name <i>*</i></label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name">
      </div>
      <div class="reg-row">
        <label for="lastName">Last Name <i>*</i></label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name">
      </div>
      <div class="reg-row">
        <label for="zip">Zip Code <i>*</i></label>
        <input type="text" id="zip" name="zip" inputmode="numeric" autocomplete="postal-code">
      </div>

      <div class="reg-actions">
        <a class="btn-lg grey" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
          <span>Cancel</span>
        </a>
        <button class="btn-lg maroon" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="19" y2="12"/><path d="M13 6l6 6-6 6"/></svg>
          <span>Next</span>
        </button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
  <nav>
    <a href="#">Internet Privacy Statement</a>
    <a href="#">Terms of Use</a>
    <a href="#">Customer Support</a>
  </nav>
  <div class="copy">&copy; Humana 2022</div>
</footer>

</body>
</html>
